services:
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    ports:
      - "9273:9273"
    depends_on:
      - db
      - app1
      - app2
      - app3

  db:
    image: postgres:15-alpine
    container_name: perf_db
    environment:
      POSTGRES_USER: perf_user
      POSTGRES_PASSWORD: perf_pass
      POSTGRES_DB: perf_shop
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf_user -d perf_shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: perf_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://perf_user:perf_pass@db:5432/perf_shop?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: perf_node_exporter
    ports:
      - "9110:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  app1:
    build: .
    container_name: perf_app1
    environment:
      - INSTANCE_ID=app1
      - DATABASE_URL=postgresql://perf_user:perf_pass@db:5432/perf_shop
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  app2:
    build: .
    container_name: perf_app2
    environment:
      - INSTANCE_ID=app2
      - DATABASE_URL=postgresql://perf_user:perf_pass@db:5432/perf_shop
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  app3:
    build: .
    container_name: perf_app3
    environment:
      - INSTANCE_ID=app3
      - DATABASE_URL=postgresql://perf_user:perf_pass@db:5432/perf_shop
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: perf_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

  prometheus:
    image: prom/prometheus:latest
    container_name: perf_prometheus
    ports:
      - "9200:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: perf_grafana
    ports:
      - "8080:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data: