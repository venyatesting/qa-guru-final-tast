[agent]
  interval = "15s"
  flush_interval = "15s"

# ---- Отдаём метрики Prometheus ----
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2

# ---- Сбор метрик Docker-контейнеров ----
[[inputs.docker]]
  endpoint = "tcp://host.docker.internal:2375"
  timeout = "5s"
  container_name_include = []
  container_name_exclude = []
  container_state_include = ["running", "paused"]
  docker_label_include = []

# Проверка метрик
# curl http://localhost:9273/metrics | grep docker_container
# https://grafana.com/grafana/dashboards/25012-pickles-container-overview-v2-telegraf/